name: ship-allowlist

# Runs scripts/check_shipped_files.py on PRs that can change what the npm tarball
# carries. ci.yml runs on every push; this one carries a path filter. The release
# workflow runs the same check right before npm publish.
on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".npmignore"
      - "src/**"
      - "scripts/check_shipped_files.py"
      - "scripts/ship-allowlist.json"
      - ".github/workflows/ship-allowlist.yml"
      - ".github/workflows/release-sdk-npm.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - run: npm run build

      - name: Pack and check every file against the allowlist
        run: python3 scripts/check_shipped_files.py
